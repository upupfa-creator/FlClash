name: Build Custom FlClash Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: '自定义桌面应用名称（留空保持默认 FlClash）'
        required: false
        default: 'MyClash Pro'
      app_id_suffix:
        description: '自定义包名后缀（填 .pro 可与原版共存）'
        required: false
        default: '.pro'

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } >> android/local.properties
          else
            keytool -genkey -v \
              -keystore android/app/keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias customkey \
              -storepass custompass123 \
              -keypass custompass123 \
              -dname "CN=MyClashPro, OU=Personal, O=Personal, L=Local, S=Local, C=US"
            {
              echo "keyAlias=customkey"
              echo "storePassword=custompass123"
              echo "keyPassword=custompass123"
            } >> android/local.properties
          fi

      - name: Customize App Name and Package Suffix
        run: |
          SUFFIX="${{ inputs.app_id_suffix }}"
          APPNAME="${{ inputs.app_name }}"
          if [ -n "$SUFFIX" ]; then
            if [ -f android/app/build.gradle.kts ]; then
              sed -i "s/applicationId = \"com.follow.clash\"/applicationId = \"com.follow.clash${SUFFIX}\"/g" android/app/build.gradle.kts
            elif [ -f android/app/build.gradle ]; then
              sed -i "s/applicationId \"com.follow.clash\"/applicationId \"com.follow.clash${SUFFIX}\"/g" android/app/build.gradle
            fi
          fi
          if [ -n "$APPNAME" ] && [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i "s/android:label=\"FlClash\"/android:label=\"${APPNAME}\"/g" android/app/src/main/AndroidManifest.xml
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA Certificates Bundle
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --arch arm64 --env stable -v

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyClash-Pro-Android-APK
          path: ./dist/*.apk
          overwrite: true
